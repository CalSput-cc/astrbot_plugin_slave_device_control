name: astrbot_plugin_slave_device_control
display_name: 核桃派外设控制
short_desc: 通过 QQ 消息远程控制核桃派 GPIO 外设
desc: |
  一个基于 AstrBot 的外设控制插件，用于通过 QQ 消息远程控制核桃派（WalnutPi 2B）的 GPIO 外设，如电机、LED 等。
  本项目为学习性质的开源项目，仅作内部测试使用。
version: 1.0.0
author: CalSput
repo: https://github.com/CalSput-cc/astrbot_plugin_slave_device_control
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
tags:
  - 硬件控制
  - 核桃派
  - GPIO